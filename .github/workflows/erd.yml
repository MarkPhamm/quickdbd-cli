# Dogfoods the qdbd GitHub Action (action.yml) on the example schema, and publishes the site:
# pull requests get a schema-diff comment; main deploys the docs (/) and live demos (/demo/) to GitHub Pages.
name: ERD
on:
  pull_request:
  push:
    branches: [main]

jobs:
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs
        run: |
          pip install -q ".[docs]"
          mkdocs build --strict -d site
      - name: Demo (200 tables) + PR diff comment
        uses: ./
        with:
          path: examples/synthetic
          output: site/demo/index.html
          qdbd-version: source
      - name: Demo (dbt jaffle_shop), via the action's dbt input
        uses: ./
        with:
          dbt-manifest: tests/fixtures/jaffle
          path: jaffle-erd/
          output: site/demo/jaffle/index.html
          qdbd-version: source
          comment: "false"
          upload-artifact: "false"
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push'
    needs: erd
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
