# Dogfoods the qdbd GitHub Action (action.yml) on the example schema, and publishes the site:
# pull requests get a schema-diff comment; main deploys the docs (/) and live demos (/demo/) to GitHub Pages.
name: ERD
on:
  pull_request:
  push:
    branches: [main]

jobs:
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs
        run: |
          pip install -q ".[docs]"
          mkdocs build --strict -d site
      - name: Demo (200 tables) + PR diff comment
        uses: ./
        with:
          path: examples/synthetic
          output: site/demo/index.html
          qdbd-version: source
      - name: Demo (dbt jaffle_shop)
        run: |
          work="$RUNNER_TEMP/jaffle" && mkdir -p "$work"
          qdbd import dbt tests/fixtures/jaffle -o "$work/erd"
          (cd "$work" && qdbd build erd -o "$GITHUB_WORKSPACE/site/demo/jaffle/index.html")
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push'
    needs: erd
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
