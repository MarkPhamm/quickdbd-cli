site_name: qdbd
site_description: ERD tooling for QuickDBD schemas and dbt projects. Check, render, explore and review database diagrams with hundreds of tables.
site_url: https://qdbd.dev/
repo_url: https://github.com/MarkPhamm/quickdbd-cli
repo_name: MarkPhamm/quickdbd-cli
edit_uri: edit/main/docs/
copyright: Made by <a href="https://github.com/MarkPhamm">Minh (Mark) Pham</a> · &copy; 2026 · Apache-2.0 · Not affiliated with QuickDBD

exclude_docs: |
  superpowers/

theme:
  name: material
  custom_dir: overrides
  font:
    text: Figtree
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    logo: material/database-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css

hooks:
  - hooks/gallery.py

extra_javascript:
  - javascripts/shortcuts.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide: guide.md
  - 1. Install: install.md
  - 2. Quick Start: getting-started.md
  - 3. Schema Files:
      - 3.1 Schema Syntax: syntax.md
      - 3.2 DBML: dbml.md
      - 3.3 Many Files, One Diagram: files.md
      - 3.4 Table Positions: layout.md
      - 3.5 Tags and Colours: tags.md
      - 3.6 Editing in VS Code: vscode.md
      - "3.7 AI Agents (MCP)": mcp.md
  - 4. Exploring a Diagram:
      - 4.1 Reading the Diagram: reading-the-diagram.md
      - 4.2 Selecting Tables: selectors.md
      - 4.3 Exports: exports.md
      - 4.4 Sharing a Link: sharing.md
  - 5. dbt Projects:
      - 5.1 dbt Import: dbt.md
      - "5.2 Worked Example: jaffle_shop": example/index.md
      - "5.3 Step 1: Import from dbt": example/import.md
      - "5.4 Step 2: Explore the Model": example/explore.md
      - "5.5 Step 3: Review a Change": example/review.md
      - "5.6 Step 4: Automate in CI": example/ci.md
  - 6. Reviewing Changes: diffs.md
  - 7. CI and Automation: github-action.md
  - 8. CLI Reference: cli.md
  - 9. Development: development.md
  - Release Notes: https://github.com/MarkPhamm/quickdbd-cli/releases
