<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The qdbd.dev blueprint sheet (docs/stylesheets/extra.css). */
      :root {
        --paper: #f2f2ee;
        --ink: #15181e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image:
          linear-gradient(rgba(21, 24, 30, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 24, 30, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(21, 24, 30, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 24, 30, 0.035) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
        background-position: 0 -12px, 0 0, 0 -12px, 0 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="75" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="75" data-track-index="0"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="text" data-composition-id="text" data-composition-src="compositions/text.html" data-start="6.2" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="explore" data-composition-id="explore" data-composition-src="compositions/explore.html" data-start="13.7" data-duration="14.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="dbt" data-composition-id="dbt" data-composition-src="compositions/dbt.html" data-start="28.5" data-duration="12.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="vscode" data-composition-id="vscode" data-composition-src="compositions/vscode.html" data-start="40.7" data-duration="20.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="more" data-composition-id="more" data-composition-src="compositions/more.html" data-start="61.3" data-duration="7.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="69.0" data-duration="6.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
