<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The qdbd.dev blueprint sheet (docs/stylesheets/extra.css). */
      :root {
        --paper: #f2f2ee;
        --ink: #15181e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image:
          linear-gradient(rgba(21, 24, 30, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 24, 30, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(21, 24, 30, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 24, 30, 0.035) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
        background-position: 0 -12px, 0 0, 0 -12px, 0 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div data-hf-id="hf-nrub" id="bg" class="clip" data-start="0" data-duration="60" data-track-index="0"></div>
      <div data-hf-id="hf-bnhx" id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-qlh7" id="write" data-composition-id="write" data-composition-src="compositions/write.html" data-start="7" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ojd4" id="build" data-composition-id="build" data-composition-src="compositions/build.html" data-start="12.5" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-g6zk" id="open" data-composition-id="open" data-composition-src="compositions/open.html" data-start="17.5" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-9uhl" id="explore" data-composition-id="explore" data-composition-src="compositions/explore.html" data-start="21.5" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ztjy" id="serve" data-composition-id="serve" data-composition-src="compositions/serve.html" data-start="33.5" data-duration="8.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-y83q" id="vscode" data-composition-id="vscode" data-composition-src="compositions/vscode.html" data-start="42" data-duration="8.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ljmb" id="more" data-composition-id="more" data-composition-src="compositions/more.html" data-start="50.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-cu4r" id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="55" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
