<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The qdbd.dev blueprint sheet (docs/stylesheets/extra.css). */
      :root {
        --paper: #f2f2ee;
        --ink: #15181e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image:
          linear-gradient(rgba(21, 24, 30, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 24, 30, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(21, 24, 30, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(21, 24, 30, 0.035) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
        background-position: 0 -12px, 0 0, 0 -12px, 0 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60.2" data-width="1920" data-height="1080">
      <div data-hf-id="hf-nrub" id="bg" class="clip" data-start="0" data-duration="60.2" data-track-index="0"></div>
      <div data-hf-id="hf-gnac" id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-920l" id="explore" data-composition-id="explore" data-composition-src="compositions/explore.html" data-start="11.2" data-duration="13.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-dbqq" id="dbt" data-composition-id="dbt" data-composition-src="compositions/dbt.html" data-start="24.7" data-duration="9.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-zp1p" id="vscode" data-composition-id="vscode" data-composition-src="compositions/vscode.html" data-start="34.2" data-duration="15.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
