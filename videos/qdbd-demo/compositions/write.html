    (function () {
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 0, filter: "blur(6px)" };

      tl.fromTo("#write-txt", { y: 0 }, { y: -40 * (26 - VIS), duration: 0.07 * (26 - VIS), ease: "none" }, 0.35 + 0.07 * VIS);

      tl.to("#write-txt", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power3.in" }, 2.7);

      tl.fromTo("#write-dbml .ld", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.05 }, 2.9);
      tl.fromTo("#write-dbml", { y: 0 }, { y: -40 * (30 - VIS), duration: 0.05 * (30 - VIS), ease: "none" }, 2.9 + 0.05 * VIS);
      say("#write-t2", 2.98, 5.25);
      window.__timelines["write"] = tl;
    })();
