  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 0, filter: "blur(6px)" };
      const ON = { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" };
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.16, stagger: 0.03, ease: "power3.in" };
      const say = (id, a, b) => { tl.fromTo(id + " .w", IN, { ...ON }, a); tl.to(id + " .w", { ...OUT }, b); };
      // Camera: put a point of the recorded 1440 x 900 page (cx, cy) at the stage centre at scale s,
      // never showing past the window's edges. TOP is where page y = 0 sits inside the window.
      const cam = (sel, t, s, cx, cy, d, TOP = 44) => {
        const qx = 96 + 1.2 * cx, qy = TOP + 1.2 * cy;
        let x = 0, y = 0;
        if (s > 1) {
          x = Math.min(-s * 96, Math.max(1920 - s * 1824, 960 - s * qx));
          y = Math.min(0, Math.max(890 - s * 1124, 445 - s * qy));
        }
        if (t === 0) tl.fromTo(sel, { x: 0, y: 0, scale: 1 }, { x, y, scale: s, duration: 0.01 }, 0);
        else tl.to(sel, { x, y, scale: s, duration: d || 0.6, ease: "power3.inOut" }, t);
      };
      const whipIn = (sel, t) => tl.fromTo(sel, { x: 360, opacity: 0, filter: "blur(14px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, t);
      const whipOut = (sel, t) => tl.to(sel, { x: -360, opacity: 0, filter: "blur(14px)", duration: 0.16, ease: "power3.in" }, t);
      // The qa branch's diff: "1 new · 2 changed", then "Show changes" narrows it to dim_cabin (new) and the facts.
      whipIn("#more-enter", 0);
      cam("#more-cam", 0, 2.1, 720, 225);
      whipOut("#more-enter", 3.42);
      // The export buttons, clicked for real.

      say("#more-t1", 0.23, 3.25);
      say("#more-t2", 3.83, 7.45);
      whipOut("#more2-enter", 7.5);
      window.__timelines["more"] = tl;
