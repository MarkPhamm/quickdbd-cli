  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 0, filter: "blur(6px)" };
      const ON = { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" };
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.16, stagger: 0.03, ease: "power3.in" };
      const say = (id, a, b) => { tl.fromTo(id + " .w", IN, { ...ON }, a); tl.to(id + " .w", { ...OUT }, b); };
      // Camera: put a point of the recorded 1440 x 900 page (cx, cy) at the stage centre at scale s.
      // VS Code's title bar (35 page px) is cropped, so page y = 0 sits 42 px above the window (TOP = -42).
      const cam = (sel, t, s, cx, cy, d, TOP = -42) => {
        const qx = 96 + 1.2 * cx, qy = TOP + 1.2 * cy;
        let x = 0, y = 0;
        if (s > 1) {
          x = Math.min(-s * 96, Math.max(1920 - s * 1824, 960 - s * qx));
          y = Math.min(0, Math.max(890 - s * 1038, 445 - s * qy));
        }
        if (t === 0) tl.fromTo(sel, { x: 0, y: 0, scale: 1 }, { x, y, scale: s, duration: 0.01 }, 0);
        else tl.to(sel, { x, y, scale: s, duration: d || 0.6, ease: "power3.inOut" }, t);
      };
      const whipOut = (sel, t) => tl.to(sel, { x: -360, opacity: 0, filter: "blur(14px)", duration: 0.16, ease: "power3.in" }, t);
      // Colour flood into the editor's world.
      tl.fromTo("#vscode-ground", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 0);
      tl.fromTo("#vscode-enter", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0.1);
      cam("#vscode-cam", 0, 1, 0, 0);
      cam("#vscode-cam", 1.0, 1.35, 1000, 400); // the diagram follows the cursor to fct_lounge_review

      cam("#vscode-cam", 17.95, 1.75, 1000, 390); // the preview: has_shower now boolean, with its description
      say("#vscode-t1", 0.38, 2.4);
      say("#vscode-t2", 4.13, 8.75);
      say("#vscode-t3", 9.13, 14.85);
      say("#vscode-t4", 15.28, 20.3);
      whipOut("#vscode-enter", 20.42);
      window.__timelines["vscode"] = tl;
    })();
