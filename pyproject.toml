[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickdbd-cli"
version = "0.4.0"
description = "Compile QuickDBD-syntax schema files into interactive HTML ER diagrams, with no table limit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/quickdbd_cli/assets/*LICENSE*"]
requires-python = ">=3.11"
authors = [{ name = "Minh (Mark) Pham" }]
keywords = ["erd", "database", "diagram", "quickdbd", "schema", "dbml", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "mini-racer>=0.14",
  "resvg-py>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fonttools>=4.50", "mcp>=2.3,<3"]  # mcp: interop tests only, not a runtime dep
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
qdbd = "quickdbd_cli.cli:main"

[project.urls]
Homepage = "https://qdbd.dev/"
Documentation = "https://qdbd.dev/guide/"
Source = "https://github.com/MarkPhamm/quickdbd-cli"
Changelog = "https://github.com/MarkPhamm/quickdbd-cli/releases"
Issues = "https://github.com/MarkPhamm/quickdbd-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quickdbd_cli"]

[tool.hatch.build.targets.sdist]
# Anchored: an unanchored "src" also matches vscode/node_modules/**/src.
include = ["/src", "/tests", "/examples", "/scripts", "/README.md", "/LICENSE", "/NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
