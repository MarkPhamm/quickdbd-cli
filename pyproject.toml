[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickdbd-cli"
version = "0.1.0"
description = "Compile QuickDBD-syntax schema files into interactive HTML ER diagrams, with no table limit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/quickdbd_cli/assets/*LICENSE*"]
requires-python = ">=3.11"
authors = [{ name = "Minh (Mark) Pham" }]
keywords = ["erd", "database", "diagram", "quickdbd", "schema"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "mini-racer>=0.14",
  "resvg-py>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fonttools>=4.50"]

[project.scripts]
qdbd = "quickdbd_cli.cli:main"

[project.urls]
Homepage = "https://github.com/MarkPhamm/quickdbd-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/quickdbd_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
