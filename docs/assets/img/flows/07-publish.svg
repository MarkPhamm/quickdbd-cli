<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 433" font-family="Geist, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Flow 7: publish after merge, from a merged change to an up-to-date diagram on a website</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181e"/></marker>
  </defs>
  <style>
    .lane { fill: #fff; stroke: #646a75; stroke-width: 1; }
    .head { fill: #f2f2ee; stroke: #646a75; stroke-width: 1; }
    .ln { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .task { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .opt { fill: #fff; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .gate { fill: #e6edf6; stroke: #15181e; stroke-width: 1.5; }
    .start { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .end { fill: #fff; stroke: #15181e; stroke-width: 3.5; }
    .fail { fill: #fff; stroke: #a14a00; stroke-width: 3.5; }
    .t { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .s { font-size: 11px; fill: #4a505b; text-anchor: middle; }
    .l { font-size: 12px; fill: #15181e; }
    .f { fill: none; stroke: #15181e; stroke-width: 1.5; marker-end: url(#arr); }
    .fo { fill: none; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <rect width="940" height="433" fill="#fff"/>

  <rect class="lane" x="1" y="1" width="938" height="130"/>
  <rect class="lane" x="1" y="131" width="938" height="170"/>
  <rect class="lane" x="1" y="301" width="938" height="130"/>
  <rect class="head" x="1" y="1" width="35" height="130"/>
  <rect class="head" x="1" y="131" width="35" height="170"/>
  <rect class="head" x="1" y="301" width="35" height="130"/>
  <text class="ln" transform="translate(23,66) rotate(-90)">Developer</text>
  <text class="ln" transform="translate(23,216) rotate(-90)">GitHub Actions</text>
  <text class="ln" transform="translate(23,366) rotate(-90)">Visitor</text>

  <circle class="start" cx="60" cy="66" r="14"/>
  <text class="s" x="44" y="106" style="text-anchor:start">Change approved</text>
  <rect class="task" x="90" y="40" width="136" height="52" rx="6"/>
  <text class="t" x="158" y="63">1. Merge the PR</text>
  <text class="s" x="158" y="80">into the main branch</text>
  <rect class="task" x="52" y="169" width="146" height="52" rx="6"/>
  <text class="t" x="125" y="192">2. Workflow starts</text>
  <text class="s" x="125" y="209">push to main</text>
  <polygon class="gate" points="268,157 320,195 268,233 216,195"/>
  <text class="t" x="268" y="191">3. Schema</text>
  <text class="t" x="268" y="207">valid?</text>
  <circle class="fail" cx="268" cy="270" r="14"/>
  <text class="s" x="290" y="274" style="text-anchor:start">Job fails, nothing published</text>
  <rect class="task" x="350" y="169" width="132" height="52" rx="6"/>
  <text class="t" x="416" y="192">4. Build diagram</text>
  <text class="s" x="416" y="209">no change colours</text>
  <rect class="task" x="508" y="169" width="150" height="52" rx="6"/>
  <text class="t" x="583" y="192">5. Deploy to Pages</text>
  <text class="s" x="583" y="209">upload, then go live</text>
  <rect class="task" x="515" y="340" width="136" height="52" rx="6"/>
  <text class="t" x="583" y="363">6. Open the site</text>
  <text class="s" x="583" y="380">link to the diagram</text>
  <rect class="task" x="681" y="340" width="150" height="52" rx="6"/>
  <text class="t" x="756" y="363">7. Explore diagram</text>
  <text class="s" x="756" y="380">search, details, joins</text>
  <circle class="end" cx="880" cy="366" r="14"/>
  <text class="s" x="936" y="406" style="text-anchor:end">Current model seen</text>
  <path class="f" d="M74,66 H88"/>
  <path class="f" d="M158,92 V153"/>
  <path class="f" d="M198,195 H214"/>
  <path class="f" d="M320,195 H348"/>
  <text class="l" x="325" y="187">Yes</text>
  <path class="f" d="M268,233 V254"/>
  <text class="l" x="276" y="247">No</text>
  <path class="f" d="M482,195 H506"/>
  <path class="f" d="M583,221 V338"/>
  <path class="f" d="M651,366 H679"/>
  <path class="f" d="M831,366 H864"/>
</svg>
