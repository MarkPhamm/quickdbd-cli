<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 262" font-family="Geist, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Flow 2: edit the schema live, fix errors, tidy the layout and commit</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181e"/></marker>
  </defs>
  <style>
    .lane { fill: #fff; stroke: #646a75; stroke-width: 1; }
    .head { fill: #f2f2ee; stroke: #646a75; stroke-width: 1; }
    .ln { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .task { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .opt { fill: #fff; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .gate { fill: #e6edf6; stroke: #15181e; stroke-width: 1.5; }
    .start { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .end { fill: #fff; stroke: #15181e; stroke-width: 3.5; }
    .fail { fill: #fff; stroke: #a14a00; stroke-width: 3.5; }
    .t { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .s { font-size: 11px; fill: #4a505b; text-anchor: middle; }
    .l { font-size: 12px; fill: #15181e; }
    .f { fill: none; stroke: #15181e; stroke-width: 1.5; marker-end: url(#arr); }
    .fo { fill: none; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <rect width="940" height="262" fill="#fff"/>

  <!-- lanes -->
  <rect class="lane" x="1" y="1" width="938" height="129"/>
  <rect class="lane" x="1" y="130" width="938" height="130"/>
  <rect class="head" x="1" y="1" width="35" height="129"/>
  <rect class="head" x="1" y="130" width="35" height="130"/>
  <text class="ln" transform="translate(23,65) rotate(-90)">Data modeller</text>
  <text class="ln" transform="translate(23,195) rotate(-90)">qdbd (live editor)</text>

  <circle class="start" cx="64" cy="65" r="14"/>
  <text class="s" x="44" y="104" style="text-anchor:start">Needs changes</text>
  <rect class="task" x="96" y="39" width="126" height="52" rx="6"/>
  <text class="t" x="159" y="62">1. Open editor</text>
  <text class="s" x="159" y="79">local live editor</text>
  <rect class="task" x="248" y="39" width="120" height="52" rx="6"/>
  <text class="t" x="308" y="62">2. Edit and save</text>
  <text class="s" x="308" y="79">pane or own editor</text>
  <polygon class="gate" points="424,157 476,195 424,233 372,195"/>
  <text class="t" x="424" y="199">3. Errors?</text>
  <rect class="task" x="506" y="169" width="130" height="52" rx="6"/>
  <text class="t" x="571" y="192">4. Diagram reloads</text>
  <text class="s" x="571" y="209">shows your changes</text>
  <polygon class="gate" points="571,27 623,65 571,103 519,65"/>
  <text class="t" x="571" y="61">5. Tidy</text>
  <text class="t" x="571" y="77">layout?</text>
  <rect class="task" x="652" y="39" width="110" height="52" rx="6"/>
  <text class="t" x="707" y="62">6. Drag tables</text>
  <text class="s" x="707" y="79">to new places</text>
  <rect class="task" x="642" y="169" width="130" height="52" rx="6"/>
  <text class="t" x="707" y="192">7. Save positions</text>
  <text class="s" x="707" y="209">layout file updated</text>
  <rect class="task" x="790" y="39" width="100" height="52" rx="6"/>
  <text class="t" x="840" y="62">8. Commit</text>
  <text class="s" x="840" y="79">schema + layout</text>
  <circle class="end" cx="922" cy="65" r="14"/>
  <text class="s" x="936" y="104" style="text-anchor:end">Layout kept</text>

  <!-- flows -->
  <path class="f" d="M78,65 H94"/>
  <path class="f" d="M222,65 H246"/>
  <path class="f" d="M308,91 V195 H370"/>
  <path class="f" d="M424,157 V65 H370"/>
  <text class="l" x="432" y="120">Yes: fix errors</text>
  <path class="f" d="M476,195 H504"/>
  <text class="l" x="481" y="187">No</text>
  <path class="f" d="M571,169 V105"/>
  <path class="f" d="M623,65 H650"/>
  <text class="l" x="630" y="57">Yes</text>
  <path class="f" d="M707,91 V167"/>
  <path class="f" d="M772,195 H840 V93"/>
  <path class="f" d="M571,27 V12 H840 V37"/>
  <text class="l" x="700" y="26">No</text>
  <path class="f" d="M890,65 H906"/>
</svg>
