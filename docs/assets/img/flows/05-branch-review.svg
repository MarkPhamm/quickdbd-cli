<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 262" font-family="Geist, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Flow 5: review a branch locally, from a branch that changes the schema to a reviewer verdict</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181e"/></marker>
  </defs>
  <style>
    .lane { fill: #fff; stroke: #646a75; stroke-width: 1; }
    .head { fill: #f2f2ee; stroke: #646a75; stroke-width: 1; }
    .ln { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .task { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .opt { fill: #fff; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .gate { fill: #e6edf6; stroke: #15181e; stroke-width: 1.5; }
    .start { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .end { fill: #fff; stroke: #15181e; stroke-width: 3.5; }
    .fail { fill: #fff; stroke: #a14a00; stroke-width: 3.5; }
    .t { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .s { font-size: 11px; fill: #4a505b; text-anchor: middle; }
    .l { font-size: 12px; fill: #15181e; }
    .f { fill: none; stroke: #15181e; stroke-width: 1.5; marker-end: url(#arr); }
    .fo { fill: none; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <rect width="940" height="262" fill="#fff"/>

  <rect class="lane" x="1" y="1" width="938" height="130"/>
  <rect class="lane" x="1" y="131" width="938" height="130"/>
  <rect class="head" x="1" y="1" width="35" height="130"/>
  <rect class="head" x="1" y="131" width="35" height="130"/>
  <text class="ln" transform="translate(23,66) rotate(-90)">Dev / Reviewer</text>
  <text class="ln" transform="translate(23,196) rotate(-90)">qdbd</text>

  <circle class="start" cx="86" cy="65" r="14"/>
  <text class="s" x="86" y="104">Schema branch</text>
  <rect class="task" x="118" y="39" width="152" height="52" rx="6"/>
  <text class="t" x="194" y="62">1. Pick base branch</text>
  <text class="s" x="194" y="79">usually main</text>
  <rect class="task" x="274" y="169" width="140" height="52" rx="6"/>
  <text class="t" x="344" y="192">2. Compare files</text>
  <text class="s" x="344" y="209">tables, columns, links</text>
  <polygon class="gate" points="482,157 534,195 482,233 430,195"/>
  <text class="t" x="482" y="191">3. Any</text>
  <text class="t" x="482" y="207">changes?</text>
  <circle class="end" cx="482" cy="65" r="14"/>
  <text class="s" x="482" y="42">Nothing to review</text>
  <rect class="task" x="577" y="169" width="140" height="52" rx="6"/>
  <text class="t" x="647" y="192">4. Build diagram</text>
  <text class="s" x="647" y="209">changes in colour</text>
  <rect class="task" x="577" y="39" width="140" height="52" rx="6"/>
  <text class="t" x="647" y="62">5. Review changes</text>
  <text class="s" x="647" y="79">colours, Show changes</text>
  <rect class="task" x="750" y="39" width="128" height="52" rx="6"/>
  <text class="t" x="814" y="62">6. Give verdict</text>
  <text class="s" x="814" y="79">approve or ask edits</text>
  <circle class="end" cx="905" cy="65" r="14"/>
  <text class="s" x="936" y="104" style="text-anchor:end">Change understood</text>
  <path class="f" d="M100,65 H116"/>
  <path class="f" d="M194,91 V195 H272"/>
  <path class="f" d="M414,195 H428"/>
  <path class="f" d="M482,157 V81"/>
  <text class="l" x="490" y="120">No</text>
  <path class="f" d="M534,195 H575"/>
  <text class="l" x="540" y="187">Yes</text>
  <path class="f" d="M647,169 V93"/>
  <path class="f" d="M717,65 H748"/>
  <path class="f" d="M878,65 H889"/>
</svg>
