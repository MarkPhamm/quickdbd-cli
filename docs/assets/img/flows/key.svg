<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 96" font-family="Geist, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Shape key for the user flow diagrams</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181e"/></marker>
  </defs>
  <style>
    .task { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .opt { fill: #fff; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .gate { fill: #e6edf6; stroke: #15181e; stroke-width: 1.5; }
    .start { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .end { fill: #fff; stroke: #15181e; stroke-width: 3.5; }
    .fail { fill: #fff; stroke: #a14a00; stroke-width: 3.5; }
    .k { font-size: 12px; fill: #15181e; text-anchor: middle; }
    .f { fill: none; stroke: #15181e; stroke-width: 1.5; marker-end: url(#arr); }
    .fo { fill: none; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <rect x="1" y="1" width="938" height="94" fill="#fff" stroke="#646a75"/>
  <circle class="start" cx="60" cy="38" r="14"/><text class="k" x="60" y="78">Start</text>
  <rect class="task" x="120" y="18" width="100" height="40" rx="6"/><text class="k" x="170" y="78">Step</text>
  <rect class="opt" x="250" y="18" width="100" height="40" rx="6"/><text class="k" x="300" y="78">Optional step</text>
  <polygon class="gate" points="430,12 466,38 430,64 394,38"/><text class="k" x="430" y="84">Decision</text>
  <circle class="end" cx="530" cy="38" r="14"/><text class="k" x="530" y="78">End</text>
  <circle class="fail" cx="620" cy="38" r="14"/><text class="k" x="620" y="78">Stops with an error</text>
  <path class="f" d="M700,38 H770"/><text class="k" x="735" y="78">Next step</text>
  <path class="fo" d="M820,38 H890"/><text class="k" x="855" y="78">Optional or async</text>
</svg>
