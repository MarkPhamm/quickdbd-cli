<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 292" font-family="Geist, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Flow 4: switch a schema between QuickDBD and DBML, with a check before anything is written</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181e"/></marker>
  </defs>
  <style>
    .lane { fill: #fff; stroke: #646a75; stroke-width: 1; }
    .head { fill: #f2f2ee; stroke: #646a75; stroke-width: 1; }
    .ln { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .task { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .opt { fill: #fff; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .gate { fill: #e6edf6; stroke: #15181e; stroke-width: 1.5; }
    .start { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .end { fill: #fff; stroke: #15181e; stroke-width: 3.5; }
    .fail { fill: #fff; stroke: #a14a00; stroke-width: 3.5; }
    .t { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .s { font-size: 11px; fill: #4a505b; text-anchor: middle; }
    .l { font-size: 12px; fill: #15181e; }
    .f { fill: none; stroke: #15181e; stroke-width: 1.5; marker-end: url(#arr); }
    .fo { fill: none; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <rect width="940" height="292" fill="#fff"/>

  <!-- lanes -->
  <rect class="lane" x="1" y="1" width="938" height="129"/>
  <rect class="lane" x="1" y="130" width="938" height="160"/>
  <rect class="head" x="1" y="1" width="35" height="129"/>
  <rect class="head" x="1" y="130" width="35" height="160"/>
  <text class="ln" transform="translate(23,65) rotate(-90)">Data modeller</text>
  <text class="ln" transform="translate(23,210) rotate(-90)">qdbd</text>

  <circle class="start" cx="84" cy="65" r="14"/>
  <text class="s" x="44" y="104" style="text-anchor:start">Needs other syntax</text>
  <rect class="task" x="116" y="39" width="140" height="52" rx="6"/>
  <text class="t" x="186" y="62">1. Pick new syntax</text>
  <text class="s" x="186" y="79">DBML or QuickDBD</text>
  <rect class="task" x="286" y="39" width="140" height="52" rx="6"/>
  <text class="t" x="356" y="62">2. Run conversion</text>
  <text class="s" x="356" y="79">files or a folder</text>
  <rect class="task" x="286" y="169" width="140" height="52" rx="6"/>
  <text class="t" x="356" y="192">3. Recompile output</text>
  <text class="s" x="356" y="209">compare with input</text>
  <polygon class="gate" points="520,157 572,195 520,233 468,195"/>
  <text class="t" x="520" y="191">4. Same</text>
  <text class="t" x="520" y="207">model?</text>
  <rect class="task" x="608" y="169" width="140" height="52" rx="6"/>
  <text class="t" x="678" y="192">5. Write files</text>
  <text class="s" x="678" y="209">warnings listed</text>
  <rect class="task" x="606" y="39" width="144" height="52" rx="6"/>
  <text class="t" x="678" y="62">6. Read warnings</text>
  <text class="s" x="678" y="79">what did not carry over</text>
  <circle class="end" cx="802" cy="65" r="14"/>
  <text class="s" x="802" y="104">Schema switched</text>
  <circle class="fail" cx="520" cy="262" r="14"/>
  <text class="l" x="542" y="266">Nothing written</text>

  <!-- flows -->
  <path class="f" d="M98,65 H114"/>
  <path class="f" d="M256,65 H284"/>
  <path class="f" d="M356,91 V167"/>
  <path class="f" d="M426,195 H466"/>
  <path class="f" d="M572,195 H606"/>
  <text class="l" x="577" y="187">Yes</text>
  <path class="f" d="M520,233 V246"/>
  <text class="l" x="528" y="243">No</text>
  <path class="f" d="M678,169 V93"/>
  <path class="f" d="M750,65 H786"/>
</svg>
