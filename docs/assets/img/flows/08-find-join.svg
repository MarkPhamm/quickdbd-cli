<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" font-family="Geist, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Flow 8: an analyst finds how two tables join and copies the SQL</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15181e"/></marker>
  </defs>
  <style>
    .lane { fill: #fff; stroke: #646a75; stroke-width: 1; }
    .head { fill: #f2f2ee; stroke: #646a75; stroke-width: 1; }
    .ln { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .task { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .opt { fill: #fff; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .gate { fill: #e6edf6; stroke: #15181e; stroke-width: 1.5; }
    .start { fill: #fff; stroke: #15181e; stroke-width: 1.5; }
    .end { fill: #fff; stroke: #15181e; stroke-width: 3.5; }
    .fail { fill: #fff; stroke: #a14a00; stroke-width: 3.5; }
    .t { font-size: 13px; font-weight: 600; fill: #15181e; text-anchor: middle; }
    .s { font-size: 11px; fill: #4a505b; text-anchor: middle; }
    .l { font-size: 12px; fill: #15181e; }
    .f { fill: none; stroke: #15181e; stroke-width: 1.5; marker-end: url(#arr); }
    .fo { fill: none; stroke: #15181e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arr); }
  </style>
  <rect width="940" height="302" fill="#fff"/>

  <rect class="lane" x="1" y="1" width="938" height="129"/>
  <rect class="lane" x="1" y="130" width="938" height="170"/>
  <rect class="head" x="1" y="1" width="35" height="129"/>
  <rect class="head" x="1" y="130" width="35" height="170"/>
  <text class="ln" transform="translate(23,65) rotate(-90)">Analyst</text>
  <text class="ln" transform="translate(23,215) rotate(-90)">Diagram page</text>

  <circle class="start" cx="86" cy="65" r="14"/>
  <text class="s" x="86" y="104">Needs a join</text>

  <rect class="task" x="118" y="39" width="140" height="52" rx="6"/>
  <text class="t" x="188" y="62">1. Find a table</text>
  <text class="s" x="188" y="79">search, then click it</text>

  <rect class="task" x="290" y="169" width="140" height="52" rx="6"/>
  <text class="t" x="360" y="192">2. Open details</text>
  <text class="s" x="360" y="209">table details panel</text>

  <rect class="task" x="290" y="39" width="140" height="52" rx="6"/>
  <text class="t" x="360" y="62">3. Pick other table</text>
  <text class="s" x="360" y="79">Path to another table</text>

  <polygon class="gate" points="520,157 572,195 520,233 468,195"/>
  <text class="t" x="520" y="191">4. Tables</text>
  <text class="t" x="520" y="207">linked?</text>

  <circle class="fail" cx="520" cy="270" r="14"/>
  <text class="s" x="540" y="274" style="text-anchor:start">No join path</text>

  <rect class="task" x="610" y="169" width="140" height="52" rx="6"/>
  <text class="t" x="680" y="192">5. See the JOIN</text>
  <text class="s" x="680" y="209">path lit, SQL shown</text>

  <rect class="task" x="610" y="39" width="140" height="52" rx="6"/>
  <text class="t" x="680" y="62">6. Copy the JOIN</text>
  <text class="s" x="680" y="79">paste into a query</text>

  <circle class="end" cx="830" cy="65" r="14"/>
  <text class="s" x="830" y="104">Join ready</text>

  <path class="f" d="M100,65 H116"/>
  <path class="f" d="M188,91 V195 H288"/>
  <path class="f" d="M360,167 V93"/>
  <path class="f" d="M430,65 H520 V155"/>
  <path class="f" d="M520,233 V254"/>
  <text class="l" x="528" y="248">No</text>
  <path class="f" d="M572,195 H608"/>
  <text class="l" x="578" y="187">Yes</text>
  <path class="f" d="M680,167 V93"/>
  <path class="f" d="M750,65 H814"/>
</svg>
