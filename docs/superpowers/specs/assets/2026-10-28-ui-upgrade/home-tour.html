<style>
/* hero screenshot: tilted back at the top, flat after 450px of scroll */
/* hero screenshot rises in on load; no tilt, so its edges stay on the page margins */
.qh-hero__shot { animation: qhshotin .9s .25s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes qhshotin { from { opacity: 0; transform: translateY(28px); } }

.qh-tour { text-align: center; }
.qh-tour h2, .qh-tour .qh-sub { margin-left: auto; margin-right: auto; }
.qh-tour__eyebrow { font: 13px "JetBrains Mono", monospace; color: var(--qd-mint); margin: 0 0 10px; }
.qh-tour__frame { position: relative; margin: 34px auto 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--qh-line);
  box-shadow: 0 40px 120px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .02); text-align: left; background: #f5f6f7; }
.qh-tour__frame::before { content: ""; position: absolute; inset: -1px; border-radius: 14px; pointer-events: none; z-index: 3;
  box-shadow: inset 0 0 0 1px rgba(122, 167, 255, 0); transition: box-shadow .3s; }
.qh-tour__frame.mine::before { box-shadow: inset 0 0 0 2px rgba(122, 167, 255, .7); }
.qh-tour__state { margin-left: auto; font: 600 11px Inter, sans-serif; color: var(--qd-mint); display: flex; align-items: center; gap: 6px; }
.qh-tour__state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: qhpulse 1.6s ease-in-out infinite; }
.qh-tour__frame.mine .qh-tour__state { color: #ffd479; }
@keyframes qhpulse { 50% { opacity: .3; } }
.qh-tour__stage { position: relative; aspect-ratio: 1440 / 820; overflow: hidden; }
.qh-tour__stage iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 820px; border: 0; transform-origin: 0 0; }
.qh-tour__overlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.qh-cursor { position: absolute; left: 0; top: 0; transform: translate(60%, 40%); filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
  transition: transform .8s cubic-bezier(.65, 0, .35, 1), opacity .3s; }
.qh-tour__frame.mine .qh-cursor { opacity: 0; }
.qh-ripple { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 2px solid #4361ee;
  animation: qhripple .5s ease-out forwards; }
@keyframes qhripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.qh-tour__toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 8px); background: #15181c; color: #fff;
  font: 500 13px Inter, sans-serif; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s, transform .2s; }
.qh-tour__toast.open { opacity: 1; transform: translate(-50%, 0); }

.qh-tour__chapters { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 0; padding: 0; text-align: left; }
.qh-tour__chapters li { position: relative; overflow: hidden; cursor: pointer; padding: 12px 14px 14px; border: 1px solid var(--qh-line);
  border-radius: 10px; background: var(--qh-card); transition: border-color .2s, transform .2s; }
.qh-tour__chapters li:hover { transform: translateY(-2px); }
.qh-tour__chapters b { display: block; color: #f3f6fb; font-size: 15px; }
.qh-tour__chapters span { color: var(--qd-label); font-size: 13px; }
.qh-tour__chapters i { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--qd-mint); }
.qh-tour__chapters li.on { border-color: var(--qd-accent); }
.qh-tour__chapters li.on i { animation: qhprog var(--dur, 9s) linear forwards; }
.qh-tour__chapters li.done i { width: 100%; opacity: .35; }
@keyframes qhprog { to { width: 100%; } }
@media (max-width: 760px) { .qh-tour__chapters { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { .qh-hero__shot { animation: none; } .qh-cursor { transition: none; } }
</style>
<script>
(function () {
  // Throwaway mockup: a scripted cursor driving the real viewer in the iframe.
  var frame = document.getElementById("tourFrame"), stage = document.getElementById("tourStage");
  var ifr = document.getElementById("tourIframe"), cursor = document.getElementById("tourCursor");
  var toastEl = document.getElementById("tourToast"), stateEl = document.getElementById("tourState");
  var chapters = [].slice.call(document.querySelectorAll("#tourChapters li"));
  var scale = 1, cx = 0, cy = 0, token = 0, W, D;

  function fitScale() { scale = stage.clientWidth / 1440; ifr.style.transform = "scale(" + scale + ")"; }
  window.addEventListener("resize", fitScale);
  fitScale();

  function Stop() {}
  function sleep(ms, my) {
    return new Promise(function (res, rej) { setTimeout(function () { my === token ? res() : rej(new Stop()); }, ms); });
  }
  function q(sel) { return D.querySelector(sel); }
  function moveTo(x, y, my, dur) {
    var d = Math.hypot(x - cx, y - cy), t = dur || Math.min(1100, 350 + d * 0.9);
    cursor.style.transitionDuration = t + "ms";
    cursor.style.transform = "translate(" + x * scale + "px," + y * scale + "px)";
    cx = x; cy = y;
    return sleep(t + 80, my);
  }
  function moveToEl(el, my, dx, dy) {
    var r = el.getBoundingClientRect();
    return moveTo(r.left + (dx == null ? r.width / 2 : dx), r.top + (dy == null ? r.height / 2 : dy), my);
  }
  function ripple() {
    var e = document.createElement("div");
    e.className = "qh-ripple";
    e.style.left = cx * scale + "px"; e.style.top = cy * scale + "px";
    stage.querySelector(".qh-tour__overlay").appendChild(e);
    setTimeout(function () { e.remove(); }, 600);
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("open");
    setTimeout(function () { toastEl.classList.remove("open"); }, 1500);
  }
  function pointer(el, type, x, y) {
    el.dispatchEvent(new W.PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerId: 1, isPrimary: true }));
  }
  async function type(input, text, my) {
    input.value = "";
    for (var i = 0; i < text.length; i++) {
      input.value += text[i];
      input.dispatchEvent(new W.Event("input", { bubbles: true }));
      await sleep(65 + Math.random() * 50, my);
    }
  }
  function key(el, k) { el.dispatchEvent(new W.KeyboardEvent("keydown", { key: k, bubbles: true })); }
  function reset() {
    var qi = q("#q"); qi.value = ""; qi.dispatchEvent(new W.Event("input", { bubbles: true }));
    var f = q("#filter"); if (f.value) { f.value = ""; key(f, "Enter"); }
    key(D, "Escape");
    W.qdbdProto && W.qdbdProto.clear();
    q("#zfit").click();
  }
  function hitPoint(k) {
    var p = q('.hit path[data-k="' + k + '"]');
    if (!p) return null;
    var m = p.getPointAtLength(p.getTotalLength() * 0.5), ctm = p.getScreenCTM();
    return { el: p, x: m.x * ctm.a + ctm.e, y: m.y * ctm.d + ctm.f };
  }

  var steps = [
    async function (my) { // search
      await moveToEl(q("#q"), my, 40);
      ripple(); await sleep(250, my);
      await type(q("#q"), "SalesOrderH", my);
      await sleep(350, my);
      var ti = q('.ti[data-id="SalesOrderHeader"]');
      await moveToEl(ti, my, 60);
      ripple(); ti.click();
      await sleep(2600, my);
    },
    async function (my) { // relationship card
      var ti = q('.ti[data-id="SalesOrderHeader"]');
      if (!ti || !ti.classList.contains("cur")) { var qi = q("#q"); qi.value = "SalesOrderHeader"; qi.dispatchEvent(new W.Event("input", { bubbles: true })); q('.ti[data-id="SalesOrderHeader"]').click(); await sleep(900, my); }
      await sleep(300, my);
      var h = hitPoint("SalesOrderHeader|CustomerID|Customer|CustomerID");
      await moveTo(h.x, h.y, my);
      ripple();
      pointer(h.el, "pointerdown", h.x, h.y); pointer(h.el, "pointerup", h.x, h.y);
      await sleep(1300, my);
      var copy = q("#rcard a");
      await moveToEl(copy, my);
      ripple(); copy.textContent = "Copied"; toast("JOIN copied");
      await sleep(2000, my);
    },
    async function (my) { // selectors
      reset(); await sleep(700, my);
      var f = q("#filter");
      await moveToEl(f, my, 60);
      ripple(); await sleep(200, my);
      await type(f, "+SalesOrderDetail", my);
      key(f, "Enter");
      await sleep(2800, my);
    },
    async function (my) { // join path
      reset(); await sleep(600, my);
      var qi = q("#q");
      await moveToEl(qi, my, 40); ripple();
      await type(qi, "SalesOrderDetail", my);
      var ti = q('.ti[data-id="SalesOrderDetail"]');
      await moveToEl(ti, my, 60); ripple(); ti.click();
      await sleep(900, my);
      var pin = q("#pathto");
      await moveToEl(pin, my, 50); ripple();
      await type(pin, "Person", my);
      key(pin, "Enter");
      await sleep(1600, my);
      var sql = q("#pathsql");
      if (sql) { await moveToEl(sql, my); ripple(); toast("SQL copied"); }
      await sleep(2400, my);
    },
  ];
  var DUR = [7, 8, 7, 11];

  async function play(from) {
    var my = ++token;
    try {
      for (var i = from; ; i = (i + 1) % steps.length) {
        chapters.forEach(function (c, j) { c.classList.toggle("on", j === i); c.classList.toggle("done", j < i); c.style.setProperty("--dur", DUR[j] + "s"); });
        var bar = chapters[i].querySelector("i"); bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
        if (i === 0) { reset(); await sleep(800, my); }
        await steps[i](my);
      }
    } catch (e) { if (!(e instanceof Stop)) console.error(e); }
  }
  var next = 0, resumeT = null;
  chapters.forEach(function (c, j) { c.onclick = function () { next = j; if (j !== 1) reset(); play(j); }; });
  frame.addEventListener("mouseenter", function () {
    clearTimeout(resumeT); token++;
    frame.classList.add("mine"); stateEl.textContent = "Your turn";
  });
  frame.addEventListener("mouseleave", function () {
    frame.classList.remove("mine"); stateEl.textContent = "Playing";
    resumeT = setTimeout(function () { play(0); }, 1500);
  });
  ifr.addEventListener("load", function () {
    W = ifr.contentWindow; D = ifr.contentDocument;
    var io = new IntersectionObserver(function (es) {
      if (es[0].isIntersecting) { io.disconnect(); setTimeout(function () { play(0); }, 600); }
    }, { threshold: 0.4 });
    io.observe(frame);
  });
})();
</script>
